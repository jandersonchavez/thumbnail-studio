name: Publicar ZERO A 2 STUDIO no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --include=dev

      # As fotos dos usuarios nunca sao enviadas para este workflow.
      # Apenas os pesos do modelo e o runtime WASM sao baixados aqui.
      - name: Preparar modelos de recorte local
        run: npm run models:setup

      # Define a base somente na publicacao, preservando o localhost.
      - name: Compilar para o GitHub Pages
        run: npm run build -- --base=/thumbnail-studio/

      - name: Conferir arquivos publicados
        run: test -f dist/index.html && test -d dist/models && test -n "$(ls -A dist/models)"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato da pagina
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
