name: Publicar ZERO A 2 STUDIO no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi

      - name: Conferir imagens do editor
        run: npm run check:assets

      # Modelo/WASM servidos pelo mesmo site; fotos nunca são enviadas para o Actions.
      - name: Preparar modelos de IA local
        run: npm run models:setup

      - name: Compilar React + Vite para /thumbnail-studio/
        run: npm run build -- --base=/thumbnail-studio/

      - name: Conferir imagens e modelos publicados
        run: |
          npm run check:dist
          test -s dist/index.html
          test -d dist/models
          test -n "$(find dist/models -type f -size +0c -print -quit)"
          grep -q '/thumbnail-studio/assets/' dist/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
